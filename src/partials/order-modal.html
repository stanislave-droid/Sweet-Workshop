<div class="order-modal-overlay is-hidden">
  <div class="order-modal">
    <button class="order-modal-close-btn" type="button">✕</button>

    <h2 class="order-modal-title">Оформлення замовлення</h2>

    <form class="order-form">
      <label class="order-form-label">
        Ім’я*
        <input type="text" name="name" class="order-form-input" />
      </label>

      <label class="order-form-label">
        Телефон*
        <input type="tel" name="phone" class="order-form-input" />
      </label>

      <label class="order-form-label">
        Коментар
        <textarea name="comment" class="order-form-textarea"></textarea>
      </label>

      <button type="submit" class="order-form-submit-btn">
        Надіслати заявку
      </button>
    </form>
  </div>
</div>
