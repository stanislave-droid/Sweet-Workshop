<section class="feedback" id="feedback">
  <div class="container">
    <h2 class="feedback-title">Відгуки клієнтів</h2>
    <p class="feedback-subtitle">
      Найкращі десерти, які я коли-небудь куштував!
    </p>
    <div class="feedback-slider-container">
      <button
        type="button"
        class="swiper-button-prev feedback-prev feedback-arrow"
      >
        <svg class="arrow-icon" width="48" height="48">
          <use href="/img/icons.svg#icon-arrow_back"></use>
        </svg>
      </button>

      <div class="swiper feedback-slider">
        <ul class="swiper-wrapper feedback-list" id="feedbacks-container"></ul>
      </div>

      <button
        type="button"
        class="swiper-button-next feedback-next feedback-arrow"
      >
        <svg class="arrow-icon" width="24" height="24">
          <use href="/img/icons.svg#icon-arrow_forward"></use>
        </svg>
      </button>
    </div>

    <div class="swiper-pagination feedback-pagination"></div>
  </div>
</section>
